spring.application.name=demo-producto-pedido-service
server.port=8080

# Configuración de JWT
jwt.secret.key=EstaEsUnaClaveSuperSecretaYLoSuficientementeLargaParaCumplirConJWT256Bits!!
jwt.expiration.ms=86400000

# Configuración de Base de Datos para Render (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}}